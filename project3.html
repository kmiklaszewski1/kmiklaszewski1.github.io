<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programowanie Gier 3</title>
    <link href="https://fonts.googleapis.com/css?family=Sora:wght@400,600,700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #191919; color: #ffeef0; font-family: 'Sora', sans-serif; }
        .go-back { display: inline-block; margin-bottom: 20px; color: #f5a9c0; text-decoration: none; font-size: 1.1rem; }
        .project-container { max-width: 1100px; margin: 40px auto; padding: 20px; }
        .gameplay-video-container { width: 100%; margin-bottom: 60px; border-radius: 10px; overflow: hidden; background: rgba(32,32,32,0.6); }
        .gameplay-video-container video { width: 100%; height: auto; display: block; }
        h1 { font-size: 2.8rem; color: #f5a9c0; margin-bottom: 20px; }
        h2 { font-size: 2rem; color: #ffeef0; margin-top: 40px; margin-bottom: 20px; border-bottom: 2px solid #f5a9c0; padding-bottom: 10px; }
        .project-content { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-bottom: 60px; }
        .about-section, .project-info { background: rgba(32,32,32,0.6); padding: 30px; border-radius: 10px; }
        .info-item { margin-bottom: 15px; font-size: 1.1rem; display: flex; align-items: center; gap: 10px; }
        .info-label { color: #f5a9c0; font-weight: 600; white-space: nowrap; }
        .info-value { color: #facad7; }
        section { margin-bottom: 50px; line-height: 1.6; }
        section p { font-size: 1.2rem; color: #ffffff; }
        a { color: #f5a9c0; text-decoration: underline; }
        @media (max-width: 768px) { .project-content { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="project-container">
        <a href="index.html" class="go-back"><i class="fas fa-arrow-left"></i> Powrot</a>
        <h1>Programowanie Gier 3</h1>

        <!-- Gameplay Video Section -->
        <div class="gameplay-video-container">
            <video autoplay muted loop playsinline>
                <source src="project3-gameplay.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

        <div class="project-content">
            <div class="about-section">
                <h2>O Projekcie</h2>
                <p>Zaawansowany projekt gry z złożonymi systemami i grąwką na profesjonalnym poziomie.</p>
            </div>

            <div class="project-info">
                <h2>Informacje Projektu</h2>
                <div class="info-item">
                    <span class="info-label"><i class="fas fa-user"></i> Rola:</span>
                    <span class="info-value">Game Programmer</span>
                </div>
                <div class="info-item">
                    <span class="info-label"><i class="fas fa-users"></i> Rozmiar Zespolu:</span>
                    <span class="info-value">3</span>
                </div>
                <div class="info-item">
                    <span class="info-label"><i class="fas fa-clock"></i> Czas Trwania:</span>
                    <span class="info-value">6 tygodni</span>
                </div>
                <div class="info-item">
                    <span class="info-label"><i class="fas fa-gamepad"></i> Silnik:</span>
                    <span class="info-value">Unreal Engine</span>
                </div>
            </div>
        </div>

        <section>
            <h2>Opis Projektu</h2>
            <p>Treść do uzupełnienia.</p>
        </section>

    </div>
</body>
</html>
